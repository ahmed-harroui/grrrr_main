# Daily run of the Grr content engine. It follows the settings of the Studio dashboard
# (/studio → Tableau de bord): pause, guides and "did you know" threads per day, draft vs. direct
# publishing. Each run writes guides from the queue (refilling it with AI ideas over every animal
# when empty), posts the threads on the least covered animals, then shares every published guide
# not yet shared: its thread on the site's /threads feed, the guide in the GRRR Care assistant.
#
# Repo settings → Secrets and variables → Actions:
#   secrets:   ANTHROPIC_API_KEY, SANITY_API_WRITE_TOKEN, SUPABASE_SECRET_KEY
#   variables: NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SUPABASE_URL,
#              NEXT_PUBLIC_SANITY_DATASET (optional, default "production")
name: Content engine

on:
  schedule:
    - cron: '0 8 * * *' # every day at 08:00 UTC (sanity/dashboard.tsx nextRun matches it)
  workflow_dispatch:

concurrency:
  group: content-engine
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      # Not sensitive, so a variable is enough; a secret of the same name works too
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Daily run
        run: pnpm content scheduled
